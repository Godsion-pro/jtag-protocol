# openocd/sim_tap.cfg — OpenOCD 0.12 <-> Verilated jtag_tap (sim/obj_dir/Vrbb_tap) over remote_bitbang.
# Start the simulator first:  ./sim/obj_dir/Vrbb_tap +port=9999
# Then:                       openocd -f openocd/sim_tap.cfg

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9999
# remote_bitbang has no speed control; declaring a value only silences OpenOCD's "speed not selected" warning
adapter speed 1000

# TRST* is wired, there is no SRST (CLAUDE.md §0, IEEE 1149.1-2013 4.1.1 b)
reset_config trst_only

# IR 5 bits; Capture-IR pattern 00001, checked on the two LSBs "01" (7.1.1 d);
# IDCODE 0xDEADBEEF (decisions.md D-003)
jtag newtap kh tap -irlen 5 -ircapture 0x01 -irmask 0x03 -expected-id 0xdeadbeef
